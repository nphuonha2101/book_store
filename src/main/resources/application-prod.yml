spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
  thymeleaf:
    cache: true

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

logging:
  level:
    root: INFO
    com.ecommerce.book_store: INFO
