spring:
  application:
    name: book_store
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/book_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    # Legacy services map lazy relations to DTOs outside repository calls.
    # Keep OSIV enabled until those mappings are moved into transactions.
    open-in-view: true
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
  session:
    store-type: redis
    timeout: 12h
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: profile,email,openid
            redirect-uri: "${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      # Mail is optional; a missing SMTP password must not mark the API as DOWN.
      enabled: ${MAIL_HEALTH_ENABLED:false}
  info:
    env:
      enabled: true

logging:
  level:
    root: INFO
    com.ecommerce.book_store: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

jwt:
  secret:
    key: ${JWT_SECRET:}
  expiration:
    time: ${JWT_EXPIRATION_MS:86400000}

react:
  client:
    url: ${FRONTEND_URL:http://localhost:3000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@npbookstore.local}
      password: ${SEED_ADMIN_PASSWORD:Admin@123456}
    user:
      email: ${SEED_USER_EMAIL:demo@npbookstore.local}
      password: ${SEED_USER_PASSWORD:Demo@123456}

firebase:
  credentials:
    url: ${FIREBASE_CREDENTIALS_PATH:}
  storage:
    bucket: ${FIREBASE_STORAGE_BUCKET:}

payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}

password:
  random:
    string:
      length: ${PASSWORD_RANDOM_LENGTH:10}

config:
  mail:
    from: ${MAIL_FROM:no-reply@npbookstore.local}

vosk:
  library:
    path: ${VOSK_LIBRARY_PATH:}
  model:
    path: ${VOSK_MODEL_PATH:models/vosk-model-small-vn-0.4}
